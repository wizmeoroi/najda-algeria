  :root{
    --primary:#1E3A5F; --primary-light:#2C4F7C; --secondary:#3F7A5C;
    --bg:#F7F6F2; --surface:#FFFFFF; --text:#1C2530; --muted:#5B6572; --border:#E3E1DA;
    --alert:#C23B3B; --alert-bg:#FBEAEA; --warning:#C98A2C; --warning-bg:#FBF1E0;
    --info:#2F6690; --info-bg:#E9F1F6; --success:#3F7A5C; --success-bg:#EAF3EE;
    --unknown:#8A8F98; --unknown-bg:#EEEDEA; --radius:10px;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:"Segoe UI","Tahoma","Geeza Pro","Noto Sans Arabic",Arial,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;}
  [dir="ltr"] body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  a{color:inherit;} button{font-family:inherit;}
  .app{max-width:1080px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:var(--primary);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:#E8583F;flex:none;}
  .conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:5px;}
  .conn-ok{background:#5BBF8A;} .conn-bad{background:#E8583F;}
  .lang-switch{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:8px;padding:3px;}
  .lang-switch button{background:transparent;border:none;color:#fff;opacity:.7;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;}
  .lang-switch button.active{background:#fff;color:var(--primary);opacity:1;font-weight:700;}
  .statusbar{background:#16283F;color:#CBD8E6;font-size:12px;padding:6px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center;}
  .nav{display:flex;overflow-x:auto;gap:2px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 8px;position:sticky;top:65px;z-index:19;}
  .nav button{flex:none;background:transparent;border:none;padding:12px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  .nav button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;}
  main{flex:1;padding:16px;padding-bottom:80px;}
  .disclaimer-banner{background:var(--info-bg);color:var(--primary);border:1px solid #cfe0ea;border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:16px;}
  .setup-banner{background:var(--alert-bg);color:var(--alert);border:1px solid #f0c9c9;border-radius:var(--radius);padding:14px;font-size:13px;margin-bottom:16px;font-weight:600;}
  .hero{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 18px;margin-bottom:18px;box-shadow:var(--shadow);}
  .hero h1{font-size:21px;margin:0 0 6px;}
  .hero p{color:var(--muted);margin:0 0 16px;font-size:14px;}
  .hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .big-btn{border:none;border-radius:12px;padding:18px 12px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;}
  .big-btn.affected{background:var(--alert);color:#fff;}
  .big-btn.helper{background:var(--secondary);color:#fff;}
  .big-btn small{display:block;font-weight:400;font-size:11.5px;opacity:.9;margin-top:4px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;}
  .chip{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--text);}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .section-title{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .section-title small{font-weight:400;color:var(--muted);font-size:12px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .card-title{font-weight:700;font-size:14.5px;}
  .card-sub{font-size:13px;color:var(--text);margin-top:2px;}
  .card-meta{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .badge .d{width:7px;height:7px;border-radius:50%;}
  .badge.verified{background:var(--success-bg);color:var(--success);} .badge.verified .d{background:var(--success);}
  .badge.reported{background:var(--info-bg);color:var(--info);} .badge.reported .d{background:var(--info);}
  .badge.community{background:var(--warning-bg);color:var(--warning);} .badge.community .d{background:var(--warning);}
  .badge.outdated{background:var(--unknown-bg);color:var(--unknown);} .badge.outdated .d{background:var(--unknown);}
  .badge.resolved{background:#EFEFEF;color:#7A7A7A;} .badge.resolved .d{background:#9A9A9A;}
  .badge.critical{background:var(--alert-bg);color:var(--alert);} .badge.critical .d{background:var(--alert);}
  .empty-state{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted);font-size:13.5px;}
  .empty-state b{display:block;color:var(--text);font-size:14.5px;margin-bottom:4px;}
  .form-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .form-card h3{margin:0 0 4px;font-size:15px;}
  .form-card p.hint{color:var(--muted);font-size:12.5px;margin:0 0 14px;}
  label{display:block;font-size:12.5px;font-weight:700;margin:10px 0 4px;color:var(--text);}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:#fff;color:var(--text);font-family:inherit;}
  textarea{min-height:70px;resize:vertical;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .submit-btn{margin-top:14px;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer;width:100%;}
  .submit-btn:hover{background:var(--primary-light);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
  .note{font-size:11.5px;color:var(--muted);margin-top:8px;}
  .honeypot{position:absolute;left:-9999px;top:-9999px;}
  .progress{background:var(--bg);border-radius:20px;height:8px;overflow:hidden;margin:6px 0;border:1px solid var(--border);}
  .progress > div{height:100%;background:var(--secondary);}
  .urgency-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;}
  .contact-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0;}
  .contact-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--alert-bg);color:var(--alert);border:1px solid #f0c9c9;border-radius:10px;padding:14px;font-weight:700;text-decoration:none;font-size:13.5px;}
  .contact-btn .num{font-size:16px;}
  .source-list{font-size:12px;color:var(--muted);}
  footer{background:var(--primary);color:#cdd8e4;font-size:11.5px;padding:20px 16px;text-align:center;}
  footer .disc{max-width:640px;margin:0 auto 10px;}
  .safety-banner{background:var(--alert-bg);border:1px solid #f0c9c9;color:var(--alert);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;font-weight:600;}
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;}
  .pill-btn{background:var(--primary);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:700;}
  .pill-btn.outline{background:transparent;color:var(--primary);border:1px solid var(--primary);}
  .row-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .row-actions button{flex:1;min-width:70px;border:none;border-radius:6px;padding:7px;font-size:11px;font-weight:700;cursor:pointer;}
  .row-actions .approve{background:var(--success-bg);color:var(--success);}
  .row-actions .flag{background:var(--warning-bg);color:var(--warning);}
  .row-actions .reject{background:var(--alert-bg);color:var(--alert);}
  .row-actions .neutral{background:var(--bg);color:var(--text);border:1px solid var(--border);}
  .backlink{background:none;border:none;color:var(--primary);font-size:13px;cursor:pointer;padding:0;margin-bottom:10px;font-weight:700;}
  .loading{text-align:center;color:var(--muted);font-size:13px;padding:20px;}
  .coord-box{background:var(--success-bg);border:1px solid #cfe6d8;border-radius:10px;padding:12px;margin-top:10px;font-size:13px;color:var(--success);}
  .coord-box.missing{background:var(--unknown-bg);color:var(--unknown);border-color:var(--border);}
</style>
</head>

function t(key){ return STR[LANG][key]; }
function tv(obj){ return obj[LANG] || obj.ar; }

function el(tag, props, children){
  const e = document.createElement(tag);
  if(props) for(const k in props){
    if(k === "class") e.className = props[k];
    else if(k === "html") e.innerHTML = props[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else e.setAttribute(k, props[k]);
  }
  (children||[]).forEach(c => { if(c!==null && c!==undefined) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function badge(clsKey, label){ return el("span", {class:"badge "+clsKey}, [el("span",{class:"d"}), label]); }
function statusBadge(statusId){ const s = STATUS[statusId] || STATUS.new; return badge(s.cls, s[LANG]); }
function timeAgo(ts){
  const diffMs = Date.now() - ts;
  const mins = Math.max(1, Math.floor(diffMs/60000));
  if(mins < 60) return t("minutesAgo").replace("{n}", mins);
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return t("hoursAgo").replace("{n}", hrs);
  const days = Math.floor(hrs/24);
  return t("daysAgo").replace("{n}", days);
}
function wilayaName(id){ const w = WILAYAS.find(x=>x.id===id); return w ? tv(w.name) : id; }

/* =====================================================================
   DATA LAYER — Supabase (shared, persistent, realtime). No localStorage
   is used for needs/offers/reports: every write goes straight to the
   database, and every visitor's screen updates via Realtime.
   ===================================================================== */
function mapNeedFromDb(r){
  return { id:r.id, wilaya:r.wilaya, commune:r.commune, locality:r.locality, items:r.items, qty:r.qty,
    category:r.category, urgency:r.urgency, notes:r.notes, contact:r.contact, status:r.status,
    source:r.source, sourceType:r.source_type, coordination:r.coordination,
    totalQty:r.total_qty, receivedQty:r.received_qty, ts: new Date(r.created_at).getTime() };
}
function mapOfferFromDb(r){
  return { id:r.id, kind:r.kind, name:r.name, wilaya:r.wilaya, details:r.details, contact:r.contact,
    status:r.status, ts: new Date(r.created_at).getTime() };
}
function mapReportFromDb(r){
  return { id:r.id, needId:r.need_id, reason:r.reason, ts: new Date(r.created_at).getTime() };
}

async function loadAllData(){
  if(!sb) return;
  const [needsRes, offersRes, reportsRes] = await Promise.all([
    sb.from("needs").select("*").order("created_at",{ascending:false}),
    sb.from("offers").select("*").order("created_at",{ascending:false}),
    sb.from("reports").select("*").order("created_at",{ascending:false}),
  ]);
  if(needsRes.error) console.error("load needs error", needsRes.error);
  if(offersRes.error) console.error("load offers error", offersRes.error);
  if(reportsRes.error) console.error("load reports error", reportsRes.error);
  STORE.needs = (needsRes.data||[]).map(mapNeedFromDb);
  STORE.offers = (offersRes.data||[]).map(mapOfferFromDb);
  STORE.reports = (reportsRes.data||[]).map(mapReportFromDb);
}

function upsertLocal(arrName, mapped){
  const arr = STORE[arrName];
  const i = arr.findIndex(x=>x.id===mapped.id);
  if(i===-1) arr.unshift(mapped); else arr[i] = mapped;
}
function removeLocal(arrName, id){
  STORE[arrName] = STORE[arrName].filter(x=>x.id!==id);
}

function subscribeRealtime(){
  if(!sb) return;
  sb.channel("public:najda")
    .on("postgres_changes", {event:"*", schema:"public", table:"needs"}, payload=>{
      if(payload.eventType==="DELETE"){ removeLocal("needs", payload.old.id); }
      else{ upsertLocal("needs", mapNeedFromDb(payload.new)); }
      render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"offers"}, payload=>{
      if(payload.eventType==="DELETE"){ removeLocal("offers", payload.old.id); }
      else{ upsertLocal("offers", mapOfferFromDb(payload.new)); }
      render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"reports"}, payload=>{
      if(payload.eventType==="DELETE"){ removeLocal("reports", payload.old.id); }
      else{ upsertLocal("reports", mapReportFromDb(payload.new)); }
      render();
    })
    .subscribe(status=>{ REALTIME_CONNECTED = (status === "SUBSCRIBED"); render(); });
}

async function dbInsertNeed(need){
  const row = { wilaya:need.wilaya, commune:need.commune, locality:need.locality, items:need.items, qty:need.qty,
    category:need.category, urgency:need.urgency, notes:need.notes, contact:need.contact, status:need.status,
    source:need.source, source_type:need.sourceType, coordination:need.coordination };
  const {data, error} = await sb.from("needs").insert(row).select().single();
  if(error){ console.error(error); throw error; }
  upsertLocal("needs", mapNeedFromDb(data));
  return data;
}
async function dbUpdateNeed(id, patch){
  const dbPatch = {};
  if("status" in patch) dbPatch.status = patch.status;
  if("receivedQty" in patch) dbPatch.received_qty = patch.receivedQty;
  if("totalQty" in patch) dbPatch.total_qty = patch.totalQty;
  const {data, error} = await sb.from("needs").update(dbPatch).eq("id", id).select().single();
  if(error){ console.error(error); throw error; }
  upsertLocal("needs", mapNeedFromDb(data));
}
async function dbDeleteNeed(id){
  const {error} = await sb.from("needs").delete().eq("id", id);
  if(error){ console.error(error); throw error; }
  removeLocal("needs", id);
}
async function dbInsertOffer(offer){
  const row = { kind:offer.kind, name:offer.name, wilaya:offer.wilaya, details:offer.details, contact:offer.contact, status:"pending" };
  const {data, error} = await sb.from("offers").insert(row).select().single();
  if(error){ console.error(error); throw error; }
  upsertLocal("offers", mapOfferFromDb(data));
}
async function dbUpdateOffer(id, status){
  const {data, error} = await sb.from("offers").update({status}).eq("id", id).select().single();
  if(error){ console.error(error); throw error; }
  upsertLocal("offers", mapOfferFromDb(data));
}
async function dbDeleteOffer(id){
  const {error} = await sb.from("offers").delete().eq("id", id);
  if(error){ console.error(error); throw error; }
  removeLocal("offers", id);
}
async function dbInsertReport(report){
  const row = { need_id: report.needId, reason: report.reason };
  const {data, error} = await sb.from("reports").insert(row).select().single();
  if(error){ console.error(error); throw error; }
  upsertLocal("reports", mapReportFromDb(data));
}
async function dbDeleteReport(id){
  const {error} = await sb.from("reports").delete().eq("id", id);
  if(error){ console.error(error); throw error; }
  removeLocal("reports", id);
}

function needCard(n, opts){
  opts = opts || {};
  const c = el("div",{class:"card"});
  const top = el("div",{class:"card-top"});
  const u = URGENCY[n.urgency] || URGENCY.normal;
  top.appendChild(el("span",{class:"urgency-tag"}, [u.ic+" "+u[LANG]]));
  top.appendChild(statusBadge(n.status));
  c.appendChild(top);
  const loc = "📍 "+wilayaName(n.wilaya)+(n.commune ? (" — "+n.commune) : "")+(n.locality ? (" — "+n.locality) : "");
  c.appendChild(el("div",{class:"card-title"}, [loc]));
  const catLabel = n.category ? (CATEGORIES.find(c2=>c2.id===n.category) ? CATEGORIES.find(c2=>c2.id===n.category).ic+" " : "") : "";
  c.appendChild(el("div",{class:"card-sub"}, ["📦 "+catLabel+n.items]));
  if(n.qty) c.appendChild(el("div",{class:"card-sub"}, [(LANG==="ar"?"الكمية: ":LANG==="fr"?"Quantité : ":"Quantity: ")+n.qty]));
  if(n.totalQty){
    const received = n.receivedQty || 0;
    const pct = Math.min(100, Math.round((received/n.totalQty)*100));
    c.appendChild(el("div",{class:"progress"}, [el("div",{style:"width:"+pct+"%"})]));
    c.appendChild(el("div",{class:"card-meta"}, [received+" / "+n.totalQty]));
  }
  const meta = el("div",{class:"card-meta"});
  meta.appendChild(el("span",{}, ["🕐 "+timeAgo(n.ts)]));
  if(n.sourceType) meta.appendChild(badge("reported", n.sourceType));
  c.appendChild(meta);
  if(opts.showHelpButton){
    const btn = el("button",{class:"pill-btn", style:"margin-top:10px;", onClick:()=>showCoordination(n)}, [t("provideBtn")]);
    c.appendChild(btn);
    c.appendChild(el("div",{id:"coord-"+n.id}));
  }
  const reportBtn = el("button",{style:"background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:6px 0 0;text-decoration:underline;display:block;", onClick:()=>reportIssueFlow(n)}, [t("reportIssue")]);
  c.appendChild(reportBtn);
  return c;
}
function showCoordination(n){
  const holder = document.getElementById("coord-"+n.id);
  if(!holder) return;
  holder.innerHTML = "";
  if(n.coordination && n.coordination.trim()) holder.appendChild(el("div",{class:"coord-box"}, ["✅ "+n.coordination]));
  else holder.appendChild(el("div",{class:"coord-box missing"}, [t("coordMissing")]));
}
async function reportIssueFlow(n){
  const reasons = [t("reasonWrong"), t("reasonDup"), t("reasonGone"), t("reasonLoc"), t("reasonInappropriate")];
  const choice = prompt(t("reportIssue")+":\n1) "+reasons[0]+"\n2) "+reasons[1]+"\n3) "+reasons[2]+"\n4) "+reasons[3]+"\n5) "+reasons[4]+"\n\n("+(LANG==="ar"?"اكتب رقم 1-5":LANG==="fr"?"Entrez un numéro 1-5":"Enter a number 1-5")+")");
  const idx = parseInt(choice, 10);
  if(!idx || idx<1 || idx>5) return;
  if(!sb){ alert(t("setupTitle")); return; }
  try{ await dbInsertReport({needId:n.id, reason:reasons[idx-1]}); render();
    alert(LANG==="ar"?"تم إرسال البلاغ، شكرًا.":LANG==="fr"?"Signalement envoyé, merci.":"Report sent, thank you.");
  }catch(e){ alert(LANG==="ar"?"تعذر الإرسال، حاول لاحقًا.":LANG==="fr"?"Échec de l'envoi, réessayez.":"Failed to send, try again."); }
}

  btn.addEventListener("click", async ()=>{
    if(honeypot.value) return;
    if(!items.value.trim()) { alert(LANG==="ar"?"يرجى كتابة الاحتياج.":LANG==="fr"?"Veuillez décrire le besoin.":"Please describe the need."); return; }
    btn.setAttribute("disabled","true");
    try{
      await dbInsertNeed({
        wilaya: wilayaSel.value, commune: commune.value.trim(), locality: locality.value.trim(),
        items: items.value.trim(), qty: qty.value.trim(), category: catSel.value, urgency: urgencySel.value,
        notes: notes.value.trim(), contact: contact.value.trim(), status: "new",
        source: "self-report", sourceType: "COMMUNITY", coordination: ""
      });
      alert(t("publishedMsg"));
      VIEW = "home"; WILAYA_FILTER = "all"; render();
    }catch(e){
      btn.removeAttribute("disabled");
      alert(LANG==="ar"?"تعذر نشر الاحتياج. تحقق من اتصالك بالإنترنت وحاول مجددًا.":LANG==="fr"?"Échec de la publication. Vérifiez votre connexion et réessayez.":"Failed to publish. Check your connection and try again.");
    }
  });
  f.appendChild(btn);
  wrap.appendChild(f);
  return wrap;
}

/* ======================= HELP ======================= */
function renderHelp(){
  const wrap = el("div",{});
  wrap.appendChild(el("div",{class:"section-title"},[t("helpTitle")]));
  wrap.appendChild(el("p",{style:"color:var(--muted);font-size:12.5px;margin-top:-6px;"},[t("helpSub")]));
  wrap.appendChild(el("div",{class:"safety-banner"},[t("safetyRoad")]));

  const chips = el("div",{class:"chip-row"});
  chips.appendChild(el("button",{class:"chip"+(WILAYA_FILTER==="all"?" active":""), onClick:()=>{WILAYA_FILTER="all"; render();}}, [t("allAlgeria")]));
  WILAYAS.forEach(w=> chips.appendChild(el("button",{class:"chip"+(WILAYA_FILTER===w.id?" active":""), onClick:()=>{WILAYA_FILTER=w.id; render();}}, [tv(w.name)])) );
  wrap.appendChild(chips);

  const needs = visibleNeeds().filter(n=>n.status!=="fulfilled").sort((a,b)=>b.ts-a.ts);
  if(needs.length===0) wrap.appendChild(el("div",{class:"empty-state"},[t("noResultsMsg")]));
  else needs.forEach(n=>wrap.appendChild(needCard(n, {showHelpButton:true})));

  wrap.appendChild(el("div",{class:"section-title"},[t("generalOffers")]));
  if(!sb){
    wrap.appendChild(el("div",{class:"setup-banner"},[t("setupTitle")]));
  } else {
    wrap.appendChild(goodsForm()); wrap.appendChild(transportForm()); wrap.appendChild(accomForm());
    if(STORE.offers.length>0){
      wrap.appendChild(el("div",{class:"section-title"},[LANG==="ar"?"عروض مُرسَلة":LANG==="fr"?"Offres envoyées":"Submitted offers"]));
      STORE.offers.slice().sort((a,b)=>b.ts-a.ts).slice(0,5).forEach(o=>{
        const c = el("div",{class:"card"});
        c.appendChild(el("div",{class:"card-top"},[el("div",{class:"card-title"},[o.kind+" — "+(o.wilaya||"")]), badge("community", LANG==="ar"?"بانتظار المراجعة":LANG==="fr"?"En attente":"Pending")]));
        c.appendChild(el("div",{class:"card-sub"},[o.details||""]));
        wrap.appendChild(c);
      });
    }
  }
  return wrap;
}
function formField(labelText, inputEl){ const w = el("div",{}); w.appendChild(el("label",{},[labelText])); w.appendChild(inputEl); return w; }
function goodsForm(){
  const f = el("div",{class:"form-card"});
  f.appendChild(el("h3",{},[t("goodsForm")]));
  const name = el("input",{type:"text"}); const wilaya = el("input",{type:"text"});
  const goods = el("input",{type:"text"}); const qty = el("input",{type:"text"}); const contact = el("input",{type:"text"});
  const row = el("div",{class:"form-row"});
  row.appendChild(formField(t("wilaya"), wilaya)); row.appendChild(formField(LANG==="ar"?"الاسم":LANG==="fr"?"Nom":"Name", name));
  f.appendChild(row);
  f.appendChild(formField(LANG==="ar"?"ما الذي يمكنك توفيره؟":LANG==="fr"?"Que pouvez-vous fournir ?":"What can you provide?", goods));
  f.appendChild(formField(t("qtyLabel"), qty));
  f.appendChild(formField(t("contactLabel"), contact));
  const btn = el("button",{class:"submit-btn", onClick: async ()=>{
    if(!goods.value.trim()) return;
    try{ await dbInsertOffer({kind:"goods", name:name.value, wilaya:wilaya.value, details:goods.value+" • "+qty.value, contact:contact.value}); alert(t("publishedMsg")); render(); }
    catch(e){ alert(LANG==="ar"?"فشل الإرسال.":LANG==="fr"?"Échec de l'envoi.":"Failed to send."); }
  }}, [t("send")]);
  f.appendChild(btn);
  return f;
}
function transportForm(){
  const f = el("div",{class:"form-card"});
  f.appendChild(el("h3",{},[t("transportForm")]));
  const from = el("input",{type:"text"}); const to = el("input",{type:"text"}); const vehicle = el("input",{type:"text"}); const contact = el("input",{type:"text"});

  const btn = el("button",{class:"submit-btn", onClick: async ()=>{
    if(!from.value.trim()||!to.value.trim()) return;

  }}, [t("send")]);
  f.appendChild(btn);
  return f;
}
function accomForm(){

/* ======================= OFFICIAL INFO ======================= */

/* ======================= ADMIN ======================= */
function statusActionsRow(n){
  const row = el("div",{class:"row-actions"});
  row.appendChild(el("button",{class:"approve", onClick: async ()=>{ try{ await dbUpdateNeed(n.id,{status:"verified"}); render(); }catch(e){ alert("error"); } }}, [t("verify")]));
  row.appendChild(el("button",{class:"neutral", onClick: async ()=>{ try{ await dbUpdateNeed(n.id,{status:"reviewing"}); render(); }catch(e){ alert("error"); } }}, [t("reviewing")]));
  row.appendChild(el("button",{class:"approve", onClick: async ()=>{ try{ await dbUpdateNeed(n.id,{status:"fulfilled"}); render(); }catch(e){ alert("error"); } }}, [t("fulfilled")]));
  row.appendChild(el("button",{class:"neutral", onClick: async ()=>{ try{ await dbUpdateNeed(n.id,{status:"archived"}); render(); }catch(e){ alert("error"); } }}, [t("archive")]));
  row.appendChild(el("button",{class:"flag", onClick: async ()=>{ try{ await dbUpdateNeed(n.id,{status:"new"}); render(); }catch(e){ alert("error"); } }}, [t("unverify")]));
  row.appendChild(el("button",{class:"reject", onClick: async ()=>{
    if(!confirm(LANG==="ar"?"تأكيد الحذف؟":LANG==="fr"?"Confirmer la suppression ?":"Confirm delete?")) return;
    try{ await dbDeleteNeed(n.id); render(); }catch(e){ alert("error"); }
  }}, [t("removeSpam")]));
  return row;
}
function renderAdmin(){
  const wrap = el("div",{});
  wrap.appendChild(el("div",{class:"section-title"},[t("adminTitle")]));
  wrap.appendChild(el("div",{class:"disclaimer-banner"},[t("adminNote")]));
  if(!sb){ wrap.appendChild(el("div",{class:"setup-banner"},[t("setupTitle")])); return wrap; }
  const toolbar = el("div",{class:"admin-toolbar"});
  toolbar.appendChild(el("span",{},[LANG==="ar"?"وضع المشرف":LANG==="fr"?"Mode modérateur":"Moderator mode"]));
  toolbar.appendChild(el("button",{class:"pill-btn"+(ADMIN_MODE?"":" outline"), onClick:()=>{ADMIN_MODE=!ADMIN_MODE; render();}}, [ADMIN_MODE?"ON":"OFF"]));
  wrap.appendChild(toolbar);
  if(!ADMIN_MODE){
    wrap.appendChild(el("div",{class:"empty-state"},[LANG==="ar"?"فعّل وضع المشرف لعرض أدوات الإدارة.":LANG==="fr"?"Activez le mode modérateur.":"Enable moderator mode."]));
    return wrap;
  }
  wrap.appendChild(el("div",{class:"section-title"},[t("fieldNeedTitle")]));
  wrap.appendChild(el("p",{style:"color:var(--muted);font-size:12px;margin-top:-6px;"},[t("fieldNeedSub")]));
  wrap.appendChild(fieldNeedForm());

  wrap.appendChild(el("div",{class:"section-title"},[t("pendingQueue")+" ("+STORE.needs.length+")"]));
  if(STORE.needs.length===0) wrap.appendChild(el("div",{class:"empty-state"},[t("empty")]));
  else STORE.needs.slice().sort((a,b)=>b.ts-a.ts).forEach(n=>{
    const c = needCard(n, {}); c.appendChild(statusActionsRow(n)); wrap.appendChild(c);
  });

  wrap.appendChild(el("div",{class:"section-title"},[t("pendingQueue")+" — "+t("helpTitle")]));
  if(STORE.offers.length===0) wrap.appendChild(el("div",{class:"empty-state"},[t("empty")]));
  else STORE.offers.slice().sort((a,b)=>b.ts-a.ts).forEach(o=>{
    const c = el("div",{class:"card"});
    c.appendChild(el("div",{class:"card-top"},[el("div",{class:"card-title"},[o.kind+" — "+(o.wilaya||"")]), badge(o.status==="verified"?"verified":"community", o.status||"pending")]));
    c.appendChild(el("div",{class:"card-sub"},[o.details||""]));
    const actions = el("div",{class:"row-actions"});
    actions.appendChild(el("button",{class:"approve", onClick: async ()=>{ try{ await dbUpdateOffer(o.id,"verified"); render(); }catch(e){ alert("error"); } }}, [t("verify")]));
    actions.appendChild(el("button",{class:"reject", onClick: async ()=>{ try{ await dbDeleteOffer(o.id); render(); }catch(e){ alert("error"); } }}, [t("removeSpam")]));
    c.appendChild(actions);
    wrap.appendChild(c);
  });

  wrap.appendChild(el("div",{class:"section-title"},[t("spamReports")+" ("+STORE.reports.length+")"]));
  if(STORE.reports.length===0) wrap.appendChild(el("div",{class:"empty-state"},[t("empty")]));
  else STORE.reports.slice().sort((a,b)=>b.ts-a.ts).forEach(r=>{
    const need = STORE.needs.find(n=>n.id===r.needId);
    const c = el("div",{class:"card"});
    c.appendChild(el("div",{class:"card-title"},[r.reason]));
    c.appendChild(el("div",{class:"card-sub"},[need ? ("📍 "+wilayaName(need.wilaya)+" — "+need.items) : (LANG==="ar"?"(الاحتياج محذوف)":LANG==="fr"?"(besoin supprimé)":"(need deleted)")]));
    c.appendChild(el("div",{class:"card-meta"},["🕐 "+timeAgo(r.ts)]));
    const actions = el("div",{class:"row-actions"});
    actions.appendChild(el("button",{class:"neutral", onClick: async ()=>{ try{ await dbDeleteReport(r.id); render(); }catch(e){ alert("error"); } }}, [LANG==="ar"?"تجاهل":LANG==="fr"?"Ignorer":"Dismiss"]));
    c.appendChild(actions);
    wrap.appendChild(c);
  });
  return wrap;
}
function fieldNeedForm(){
  const f = el("div",{class:"form-card"});
  const wilayaSel = el("select",{});
  WILAYAS.forEach(w=> wilayaSel.appendChild(el("option",{value:w.id},[tv(w.name)])));
  const commune = el("input",{type:"text"});
  const items = el("textarea",{});
  const qty = el("input",{type:"text"});
  const urgencySel = el("select",{});
  Object.keys(URGENCY).forEach(k=> urgencySel.appendChild(el("option",{value:k},[URGENCY[k].ic+" "+URGENCY[k][LANG]])));
  const srcName = el("input",{type:"text"});
  const srcType = el("select",{});
  ["OFFICIAL","LOCAL_AUTHORITY","MEDIA","COMMUNITY","OTHER"].forEach(s=> srcType.appendChild(el("option",{value:s},[s])));
  const coord = el("input",{type:"text", placeholder: LANG==="ar"?"نقطة تجميع أو جهة تنسيق معتمدة (اختياري)":LANG==="fr"?"Point de collecte ou organisme de coordination (optionnel)":"Verified collection point or coordinator (optional)"});
  const row1 = el("div",{class:"form-row"});
  row1.appendChild(formField(t("wilaya"), wilayaSel)); row1.appendChild(formField(t("commune"), commune));
  f.appendChild(row1);
  f.appendChild(formField(t("itemsLabel"), items));
  const row2 = el("div",{class:"form-row"});
  row2.appendChild(formField(t("qtyLabel"), qty)); row2.appendChild(formField(t("urgencyLabel"), urgencySel));
  f.appendChild(row2);
  const row3 = el("div",{class:"form-row"});
  row3.appendChild(formField(t("sourceName"), srcName)); row3.appendChild(formField(t("sourceType"), srcType));
  f.appendChild(row3);
  f.appendChild(formField(LANG==="ar"?"وسيلة تنسيق آمنة (اختياري)":LANG==="fr"?"Coordination sécurisée (optionnel)":"Safe coordination method (optional)", coord));
  const btn = el("button",{class:"submit-btn", onClick: async ()=>{
    if(!items.value.trim() || !srcName.value.trim()) { alert(LANG==="ar"?"يرجى إدخال الاحتياج ومصدره.":LANG==="fr"?"Veuillez indiquer le besoin et sa source.":"Please enter the need and its source."); return; }
    try{
      await dbInsertNeed({
        wilaya:wilayaSel.value, commune:commune.value.trim(), locality:"",
        items:items.value.trim(), qty:qty.value.trim(), category:"", urgency:urgencySel.value, notes:"", contact:"",
        status:"verified", source:srcName.value.trim(), sourceType:srcType.value, coordination:coord.value.trim()
      });
      items.value=""; qty.value=""; srcName.value=""; coord.value="";
      render();
    }catch(e){ alert(LANG==="ar"?"فشل الإرسال.":LANG==="fr"?"Échec de l'envoi.":"Failed to send."); }
  }}, [t("send")]);
  f.appendChild(btn);
  return f;
}

  render();
  if(sb){
    await loadAllData();
    render();
    subscribeRealtime();
  }
})();
